<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador | Advance Beauty Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <div class="container my-5" style="max-width: 950px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark mb-0"><i class="bi bi-sliders"></i> Panel Administrador de Precios</h2>
            <a href="/" class="btn btn-outline-dark" target="_blank"><i class="bi bi-eye-fill"></i> Ver Vista Clientes</a>
        </div>

        <div class="card p-4 shadow-sm mb-4 border-0 rounded-4">
            <h4 class="mb-3 text-secondary"><i class="bi bi-gear-wide-connected"></i> Reglas de Flete y Adicionales (desde Pilar, Bs.As.)</h4>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">WhatsApp de Contacto:</label>
                    <input type="text" id="conf-wp" class="form-control" value="{{ config.whatsapp_phone }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Km Base Bonificados:</label>
                    <input type="number" id="conf-base-km" class="form-control" value="{{ config.limite_km_base }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Precio por Km Extra ($):</label>
                    <input type="number" id="conf-precio-km" class="form-control" value="{{ config.precio_km_extra }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Precio Operadora ($):</label>
                    <input type="number" id="conf-operadora" class="form-control" value="{{ config.operadora_precio }}">
                </div>
            </div>
        </div>

        <div class="card p-4 shadow-sm mb-4 border-0 rounded-4">
            <h4 class="mb-3 text-secondary"><i class="bi bi-box-seam-fill"></i> Precios de Equipos</h4>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Equipo</th>
                            <th>Media Jornada - 4hs ($)</th>
                            <th>Jornada Completa - 8hs ($)</th>
                            <th>Activo</th>
                        </tr>
                    </thead>
                    <tbody id="lista-equipos">
                        {% for eq in equipos %}
                        <tr data-id="{{ eq.id }}">
                            <td>
                                <strong>{{ eq.nombre }}</strong>
                                <input type="hidden" class="eq-nombre" value="{{ eq.nombre }}">
                                <input type="hidden" class="eq-desc" value="{{ eq.descripcion }}">
                            </td>
                            <td><input type="number" class="form-control eq-medio" value="{{ eq.precio_medio_dia }}"></td>
                            <td><input type="number" class="form-control eq-completo" value="{{ eq.precio_dia_completo }}"></td>
                            <td>
                                <input type="checkbox" class="form-check-input eq-activo" {% if eq.activo %}checked{% endif %}>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <button class="btn btn-success btn-lg w-100 fw-bold py-3 rounded-3" onclick="guardarCambios()"><i class="bi bi-floppy-fill"></i> Guardar Todos los Cambios</button>
    </div>

    <script>
        function guardarCambios() {
            let config = {
                whatsapp_phone: document.getElementById('conf-wp').value,
                limite_km_base: parseFloat(document.getElementById('conf-base-km').value) || 0,
                precio_km_extra: parseFloat(document.getElementById('conf-precio-km').value) || 0,
                operadora_precio: parseFloat(document.getElementById('conf-operadora').value) || 0
            };

            let equipos = [];
            document.querySelectorAll('#lista-equipos tr').forEach(row => {
                equipos.push({
                    id: row.getAttribute('data-id'),
                    nombre: row.querySelector('.eq-nombre').value,
                    descripcion: row.querySelector('.eq-desc').value,
                    precio_medio_dia: parseFloat(row.querySelector('.eq-medio').value) || 0,
                    precio_dia_completo: parseFloat(row.querySelector('.eq-completo').value) || 0,
                    activo: row.querySelector('.eq-activo').checked
                });
            });

            fetch('/api/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ config, equipos })
            })
            .then(res => res.json())
            .then(data => alert('¡Precios y configuración guardados correctamente!'))
            .catch(err => alert('Error al guardar los datos'));
        }
    </script>
</body>
</html>
