<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Advance Beauty Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #fdfbf7; font-family: 'Plus Jakarta Sans', sans-serif; color: #2c2c2c; }
        .admin-header { background: #2c2c2c; color: #fff; padding: 2rem 1rem; border-bottom: 4px solid #a86f63; }
        .card-admin { border-radius: 16px; border: none; box-shadow: 0 8px 25px rgba(168, 111, 99, 0.08); background: #ffffff; }
        .btn-custom { background: #a86f63; color: white; border: none; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 10px; }
        .btn-custom:hover { background: #8c584d; color: white; }
    </style>
</head>
<body>

    <div class="admin-header text-center">
        <h2 class="fw-bold mb-1"><i class="bi bi-sliders"></i> Panel de Control - Advance Beauty Care</h2>
        <p class="text-white-50 mb-0">Modificá parámetros generales, costos de traslado, operadora y equipos en tiempo real</p>
    </div>

    <div class="container my-5" style="max-width: 850px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="/" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Ver Sitio Web</a>
        </div>

        <div class="card card-admin p-4 p-md-5">
            <form action="/admin/actualizar" method="POST">
                
                <!-- CONFIGURACIÓN GENERAL -->
                <h4 class="fw-bold mb-3 text-secondary"><i class="bi bi-gear-fill"></i> Configuración General y Costos</h4>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Número de WhatsApp:</label>
                        <input type="text" name="whatsapp_phone" class="form-control" value="{{ config.whatsapp_phone }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">ID de Calendario:</label>
                        <input type="text" name="calendar_id" class="form-control" value="{{ config.calendar_id }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Precio KM Extra ($):</label>
                        <input type="number" step="any" name="precio_km_extra" class="form-control" value="{{ config.precio_km_extra }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Límite KM Base:</label>
                        <input type="number" step="any" name="limite_km_base" class="form-control" value="{{ config.limite_km_base }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-semibold">Precio Operadora ($):</label>
                        <input type="number" step="any" name="operadora_precio" class="form-control" value="{{ config.operadora_precio }}" required>
                    </div>
                </div>

                <hr class="my-4">

                <!-- GESTIÓN DE EQUIPOS -->
                <h4 class="fw-bold mb-4 text-secondary"><i class="bi bi-cpu-fill"></i> Gestión de Equipos</h4>

                {% for eq in equipos %}
                <div class="p-4 mb-4 border rounded-3 bg-light position-relative">
                    
                    <!-- Switch de Activo / Inactivo -->
                    <div class="form-check form-switch position-absolute top-0 end-0 mt-3 me-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="activo_{{ eq.id }}" name="activo_{{ eq.id }}" {% if eq.activo %}checked{% endif %}>
                        <label class="form-check-label fw-semibold small text-muted" for="activo_{{ eq.id }}">Visible en Web</label>
                    </div>

                    <h5 class="fw-bold text-dark mb-3">ID: <span class="text-uppercase text-danger">{{ eq.id }}</span></h5>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Equipo:</label>
                        <input type="text" name="nombre_{{ eq.id }}" class="form-control" value="{{ eq.nombre }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción:</label>
                        <textarea name="descripcion_{{ eq.id }}" class="form-control" rows="3" required>{{ eq.descripcion }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Media Jornada ($):</label>
                            <input type="number" step="any" name="precio_medio_{{ eq.id }}" class="form-control" value="{{ eq.precio_medio_dia }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Jornada Completa ($):</label>
                            <input type="number" step="any" name="precio_completo_{{ eq.id }}" class="form-control" value="{{ eq.precio_dia_completo }}" required>
                        </div>
                    </div>
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-custom w-100 py-3 mt-3">
                    <i class="bi bi-save-fill"></i> Guardar Todos los Cambios
                </button>
            </form>
        </div>
    </div>

</body>
</html>
